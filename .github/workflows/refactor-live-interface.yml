name: CAPA Interface Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "scripts/refactor-index.py"
      - ".github/workflows/refactor-live-interface.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "scripts/refactor-index.py"
      - ".github/workflows/refactor-live-interface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate generated interface wiring
        run: |
          set -euo pipefail
          python scripts/refactor-index.py
          git diff --exit-code -- index.html

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/dashboard.js
          node --check src/demo-card.js
          node --check src/northstar-sdk.js
          node --check src/storage.js
          node --check src/validation.js
